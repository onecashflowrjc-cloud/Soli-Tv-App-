
name: Build Soli TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -o SoliTV-Android-Starter.zip -d extracted

      - name: Build APK
        working-directory: extracted/soli_tv_android
        run: gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Soli-TV-APK
          path: extracted/soli_tv_android/app/build/outputs/apk/debug/app-debug.apk
          
